<div th:fragment="form">
    <form class="space-y-3 mt-3"
          hx-post="/tasks/submit"
          hx-encoding="multipart/form-data"
          hx-target="#tasks-table-panel"
          hx-swap="outerHTML">
        <input type="hidden" name="key" th:value="${selectedProcessor.key}">

        <div>
            <label class="block text-xs text-on-surface-variant uppercase tracking-widest mb-1">PDF File</label>
            <input type="file"
                   name="uploadFile"
                   accept=".pdf"
                   required
                   class="w-full px-3 py-2 rounded bg-surface-container text-on-surface file:mr-3 file:px-3 file:py-1 file:border-0 file:rounded file:bg-primary file:text-on-primary">
        </div>

        <div>
            <label class="block text-xs text-on-surface-variant uppercase tracking-widest mb-1">Target Folder</label>
            <div id="download-folder-picker"
                 hx-get="/tasks/form/download/folder-picker"
                 hx-trigger="load"
                 hx-target="#download-folder-picker"
                 hx-swap="outerHTML"></div>
        </div>

        <div>
            <label class="block text-xs text-on-surface-variant uppercase tracking-widest mb-1">PDF File Name (optional)</label>
            <input type="text"
                   name="pdfFileName"
                   placeholder="leave blank to keep uploaded name"
                   class="w-full px-3 py-2 rounded bg-surface-container text-on-surface">
        </div>

        <div>
            <label class="block text-xs text-on-surface-variant uppercase tracking-widest mb-1">ZIP Output Name (optional)</label>
            <input type="text"
                   name="zipFileName"
                   placeholder="chapter.zip"
                   class="w-full px-3 py-2 rounded bg-surface-container text-on-surface">
        </div>

        <button class="px-3 py-2 bg-primary text-on-primary rounded text-sm font-bold">Queue Task</button>
    </form>
</div>
